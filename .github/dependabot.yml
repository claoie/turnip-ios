version: 2
updates:
  # The workflow pins actions to commit SHAs; without this the pins rot
  # silently instead of arriving as a reviewable bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gemfile.lock is committed so both pipelines resolve pods with the same
  # CocoaPods. A lockfile nothing bumps is just an old CocoaPods.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
